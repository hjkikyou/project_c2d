spring.application.name=c2d

server.port=9095

# mariaDB 연결
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/cd_db
spring.datasource.username=root
spring.datasource.password=1234

#myBatis 기본 설정
mybatis.type-aliases-package=com.comdog.c2d.dto
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/*.xml

# 4. Thymeleaf & DevTools 개발 편의 설정
# DevTools가 켜져 있을 때, HTML 수정 사항이 즉시 반영되도록 캐시를 끕니다.
spring.thymeleaf.cache=true

# Spring Boot가 시작될 때 무조건 schema.sql을 실행하도록 강제하는 옵션
spring.sql.init.mode=always

mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl